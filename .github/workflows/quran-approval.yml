name: Quran With My Child — publish on approval

# Runs in the cloud so publishing works while Ahmed's Mac is closed.
#   request: emails Ahmed the private link (dispatched by the Mac pipeline after upload)
#   poll:    one pass — announce new private uploads, read replies; APPROVE -> public
#   watch:   the same, on a loop for 5.5 h inside one run
# Nothing goes public without an authenticated APPROVE reply. See quran_approval.py.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "poll = one pass, watch = keep polling 5.5 h, request = send approval email"
        type: choice
        options: [poll, watch, request]
        default: poll
      video_id:
        description: "YouTube video id (request mode)"
        type: string
        default: ""
      title:
        description: "Episode title (request mode)"
        type: string
        default: ""
      notes:
        description: "Extra notes for the email body (request mode)"
        type: string
        default: ""
      dry_run:
        description: "poll mode: report only, publish nothing, mark nothing read"
        type: boolean
        default: false
  schedule:
    # GitHub throttles frequent schedules hard — this asked for every 30 min
    # and actually fired about every FOUR HOURS, so an APPROVE reply sat all
    # morning. Long-running jobs are not throttled the same way, so instead of
    # 48 fragile pings we start a watcher that polls inside one run for 5.5 h.
    # Triggering hourly means any single surviving trigger restarts coverage;
    # cancel-in-progress hands over to the newest one so they never stack.
    #
    # Even hourly, GitHub dropped most triggers (9 Oct: fired at 02:08 and
    # 09:00 only). A Claude Routine therefore dispatches mode=watch on a fixed
    # cadence as well; this schedule stays as a free second line of defence.
    - cron: "17 * * * *"

concurrency:
  group: quran-approval
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Approve / publish
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          QWMC_APPROVAL_KEY: ${{ secrets.QWMC_APPROVAL_KEY }}
          QWMC_APPROVERS: ${{ secrets.QWMC_APPROVERS }}
          QWMC_NOTIFY: ${{ secrets.QWMC_NOTIFY }}
          QK_DEPLOY_KEY: ${{ secrets.QK_DEPLOY_KEY }}
          VIDEO_ID: ${{ inputs.video_id }}
          TITLE: ${{ inputs.title }}
          NOTES: ${{ inputs.notes }}
        run: |
          MODE="${{ inputs.mode }}"
          if [ "$MODE" = "request" ]; then
            python quran_approval.py request --video-id "$VIDEO_ID" --title "$TITLE" --notes "$NOTES"
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            python quran_approval.py poll --dry-run
          elif [ "${{ github.event_name }}" = "schedule" ] || [ "$MODE" = "watch" ]; then
            # scheduled, or dispatched by the Claude Routine: hold the run open
            # and keep polling
            python quran_approval.py watch --minutes 330 --every 120
          else
            # manual dispatch: one pass, answer immediately
            python quran_approval.py poll
          fi
