name: Daily Cash Position Email

on:
  workflow_dispatch:           # manual "Run workflow" button (also usable by a future external pinger)
    inputs:
      force:
        description: "Send now, ignoring the 08:00–23:00 Cairo window + once-per-day dedupe"
        type: boolean
        default: true           # manual button = test send; a pinger would pass false
      recipients:
        description: "Override recipients for THIS run only (comma-separated). Blank = use the secret."
        type: string
        default: ""
  schedule:
    # GitHub cron is UTC and best-effort — scheduled runs can fire HOURS late,
    # and the delay is worst at the top of the hour (:00/:05/:30/:35) when every
    # repo on the platform is scheduled. We fire on de-congested odd minutes,
    # front-loaded near 08:00 Cairo with a thinning fallback tail through the
    # afternoon. The script sends on the FIRST run at/after 08:00 Cairo and
    # dedupes to once per day (marker persisted via actions/cache below), and the
    # send window now runs to 23:00 Cairo so a very-late fire still lands same-day
    # instead of being dropped. Times are Cairo DST (UTC+3).
    # The script itself skips Fridays (weekend) — cron still fires but no send.
    #
    # MINUTE LANE: :06 and :36. Each of the three reports owns a distinct pair of
    # minutes (cash :06/:36, follow-up :18/:48, marketing :28/:58) so no two can
    # ever fire in the same minute, whatever hours are added later. Before 1 Sep
    # 2026 follow-up and marketing shared all nine minutes and both vanished on
    # the same day while this report — the only non-colliding one — arrived.
    # test_cron_collision.py enforces the lanes; run it before editing these.
    - cron: "6 5 * * *"     # ~08:06 Cairo
    - cron: "36 5 * * *"    # ~08:36
    - cron: "6 6 * * *"     # ~09:06
    - cron: "36 6 * * *"    # ~09:36
    - cron: "6 7 * * *"     # ~10:06
    - cron: "6 8 * * *"     # ~11:06  (fallback)
    - cron: "36 9 * * *"    # ~12:36  (fallback)
    - cron: "36 11 * * *"   # ~14:36  (fallback)
    - cron: "36 13 * * *"   # ~16:36  (last-resort, still same day)

# A late-firing run must never overlap an earlier one of the same workflow —
# two concurrent runs would race on the send marker and could double-send.
concurrency:
  group: daily-cash-email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Compute Cairo date
        run: echo "CAIRO_DATE=$(TZ=Africa/Cairo date +%F)" >> "$GITHUB_ENV"
      - name: Restore once-per-day send marker
        # First run of the Cairo day misses (script sends + writes the marker, which
        # is saved to cache at job end). Later same-day runs hit and the script skips.
        uses: actions/cache@v4
        with:
          path: .cash_sent_marker
          key: cash-sent-${{ env.CAIRO_DATE }}
      - name: Build and send cash position report
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          CASH_RECIPIENTS: ${{ inputs.recipients || secrets.CASH_RECIPIENTS }}
          CASH_SHEET_ID: ${{ secrets.CASH_SHEET_ID }}
        # Manual dispatch with force=true → send now (test). The external pinger
        # dispatches with force=false, so it (like the schedule) goes through the
        # script's 08:00–21:00 window + once-per-day dedupe — no duplicate sends.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            python cash_report.py --force
          else
            python cash_report.py
          fi
      - name: Upload cash report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cash-report-html
          path: cash_report.html
          if-no-files-found: ignore
      # Without this, a failed send is completely silent — the only symptom is an
      # email that never arrives, which is exactly how 1 Sep went unnoticed.
      - name: Alert Ahmed that the send failed
        if: failure()
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          ALERT_RECIPIENTS: ${{ secrets.ALERT_RECIPIENTS }}
        run: |
          python alert.py \
            --report "AHD Cash Position" \
            --reason "The scheduled GitHub Actions run failed before the email was sent." \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
