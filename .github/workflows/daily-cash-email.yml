name: Daily Cash Position Email

on:
  workflow_dispatch:           # manual "Run workflow" button (also usable by a future external pinger)
    inputs:
      force:
        description: "Send now, ignoring the 08:00–23:00 Cairo window + once-per-day dedupe"
        type: boolean
        default: true           # manual button = test send; a pinger would pass false
  schedule:
    # GitHub cron is UTC and best-effort — scheduled runs can fire HOURS late,
    # and the delay is worst at the top of the hour (:00/:05/:30/:35) when every
    # repo on the platform is scheduled. We fire on de-congested odd minutes,
    # front-loaded near 08:00 Cairo with a thinning fallback tail through the
    # afternoon. The script sends on the FIRST run at/after 08:00 Cairo and
    # dedupes to once per day (marker persisted via actions/cache below), and the
    # send window now runs to 23:00 Cairo so a very-late fire still lands same-day
    # instead of being dropped. Times are Cairo DST (UTC+3).
    # The script itself skips Fridays (weekend) — cron still fires but no send.
    - cron: "7 5 * * *"     # ~08:07 Cairo
    - cron: "27 5 * * *"    # ~08:27
    - cron: "47 5 * * *"    # ~08:47
    - cron: "13 6 * * *"    # ~09:13
    - cron: "43 6 * * *"    # ~09:43
    - cron: "23 7 * * *"    # ~10:23
    - cron: "23 8 * * *"    # ~11:23  (fallback)
    - cron: "23 10 * * *"   # ~13:23  (fallback)
    - cron: "23 12 * * *"   # ~15:23  (last-resort, still same day)

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Compute Cairo date
        run: echo "CAIRO_DATE=$(TZ=Africa/Cairo date +%F)" >> "$GITHUB_ENV"
      - name: Restore once-per-day send marker
        # First run of the Cairo day misses (script sends + writes the marker, which
        # is saved to cache at job end). Later same-day runs hit and the script skips.
        uses: actions/cache@v4
        with:
          path: .cash_sent_marker
          key: cash-sent-${{ env.CAIRO_DATE }}
      - name: Build and send cash position report
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          CASH_RECIPIENTS: ${{ secrets.CASH_RECIPIENTS }}
          CASH_SHEET_ID: ${{ secrets.CASH_SHEET_ID }}
        # Manual dispatch with force=true → send now (test). The external pinger
        # dispatches with force=false, so it (like the schedule) goes through the
        # script's 08:00–21:00 window + once-per-day dedupe — no duplicate sends.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            python cash_report.py --force
          else
            python cash_report.py
          fi
      - name: Upload cash report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cash-report-html
          path: cash_report.html
          if-no-files-found: ignore
